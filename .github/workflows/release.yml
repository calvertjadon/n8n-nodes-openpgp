# TEMPORARY: OIDC trusted-publisher round-trip verification (bootstrap
# ticket #8). Publishes inert n8n-nodes-openpgp@0.0.1 from GitHub Actions via
# OIDC to prove the binding works end-to-end with provenance BEFORE the real
# release pipeline depends on it. Version is deprecated after verification.
#
# Reverts to the inert placeholder stub immediately after the test.
# The real pipeline (CI → release-it → OIDC publish) lands with the build plan.
name: Release

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  oidc-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds
      - name: Build inert test package
        run: |
          mkdir -p test-package
          cd test-package
          cat > package.json <<'EOF'
          {
            "name": "n8n-nodes-openpgp",
            "version": "0.0.1",
            "description": "OIDC round-trip verification publish — inert placeholder, will be deprecated.",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/calvertjadon/n8n-nodes-openpgp.git"
            },
            "files": ["README.md"]
          }
          EOF
          cat > README.md <<'EOF'
          # n8n-nodes-openpgp

          OIDC round-trip verification publish (0.0.1) — inert, deprecated.
          See https://github.com/calvertjadon/n8n-nodes-openpgp
          EOF
      - name: Publish via OIDC trusted publisher
        working-directory: test-package
        run: npm publish
